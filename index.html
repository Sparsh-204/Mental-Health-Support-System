<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mental Health Support System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>Mental Health Support System</h1>
    <button onclick="toggleDarkMode()">🌙 Dark Mode</button>
</header>

<!-- Mood Tracker -->
<section>
    <h2>Daily Mood Tracker</h2>
    <select id="moodSelect">
        <option value="">Select Mood</option>
        <option value="Happy">😊 Happy</option>
        <option value="Neutral">😐 Neutral</option>
        <option value="Sad">😞 Sad</option>
        <option value="Anxious">😰 Anxious</option>
    </select>
    <button onclick="saveMood()">Save Mood</button>

    <h3>Mood History</h3>
    <div id="moodHistory"></div>

    <h3>Wellness Score</h3>
    <progress id="wellnessBar" value="50" max="100"></progress>
    <p id="wellnessText"></p>
</section>

<!-- Stress Checker -->
<section>
    <h2>Stress Level Checker</h2>
    <input type="number" id="stressInput" placeholder="Rate stress (1-10)">
    <button onclick="checkStress()">Check</button>
    <p id="stressResult"></p>
</section>

<!-- Appointment -->
<section>
    <h2>Book Appointment</h2>
    <form id="appointmentForm">
        <input type="text" id="name" placeholder="Your Name">
        <input type="email" id="email" placeholder="Your Email">
        <input type="date" id="date">
        <button type="submit">Book Now</button>
    </form>
    <p id="appointmentMessage"></p>
</section>

<!-- Chat -->
<section>
    <h2>Chat Support</h2>
    <div id="chatBox">
        <div id="chatMessages"></div>
        <input type="text" id="chatInput" placeholder="Type message...">
        <button onclick="sendMessage()">Send</button>
    </div>
</section>

<!-- Journal -->
<section>
    <h2>Private Journal</h2>
    <textarea id="journalText" rows="4" placeholder="Write your thoughts..."></textarea>
    <button onclick="saveJournal()">Save Entry</button>
    <p id="journalMessage"></p>
</section>

<!-- Breathing -->
<section>
    <h2>Breathing Exercise</h2>
    <p id="breathingText">Click Start</p>
    <button onclick="startBreathing()">Start</button>
</section>

<!-- Focus Timer -->
<section>
    <h2>Focus Timer</h2>
    <p id="timer">25:00</p>
    <button onclick="startTimer()">Start</button>
</section>

<!-- Self Care Planner -->
<section>
    <h2>Self-Care Planner</h2>
    <input type="text" id="taskInput" placeholder="Enter task">
    <button onclick="addTask()">Add</button>
    <ul id="taskList"></ul>
</section>

<!-- Quotes -->
<section>
    <h2>Daily Motivation</h2>
    <p id="quoteText">Click below</p>
    <button onclick="generateQuote()">Get Quote</button>
</section>

<button onclick="clearData()">Reset All Data</button>

<script src="script.js"></script>
</body>
</html>
